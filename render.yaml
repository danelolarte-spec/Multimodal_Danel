services:
  - type: web
    name: pig-multimodal
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/data.sqlite
    disk:
      name: pig-data
      mountPath: /var/data
      sizeGB: 1
